<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VideoStream CMS — Видеоплатформа</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a0f;--surface:#111118;--card:#16161f;--border:#1e1e2e;--accent:#e63946;--accent2:#ff6b35;--text:#e8e8f0;--muted:#6b6b80;--green:#2dc653;--font-h:'Bebas Neue',sans-serif;--font-b:'Manrope',sans-serif;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh}
header{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;gap:2rem;height:64px}
.logo{font-family:var(--font-h);font-size:2rem;letter-spacing:.05em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{-webkit-text-fill-color:var(--text)}
.search-wrap{flex:1;max-width:480px;position:relative}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;padding:.6rem 1rem .6rem 2.6rem;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.nav-tabs{display:flex;gap:.25rem;margin-left:auto}
.nav-tab{padding:.4rem .9rem;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted)}
.nav-tab.active,.nav-tab:hover{background:var(--surface);color:var(--text)}
.nav-tab.active{color:var(--accent)}
.category-filter{margin-left:1rem}
.category-select{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;padding:.4rem .8rem;outline:none;cursor:pointer}
.main{max-width:1400px;margin:0 auto;padding:2rem;display:grid;grid-template-columns:1fr 340px;gap:2rem}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.video-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.video-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 40px rgba(230,57,70,.15)}
.thumb-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface)}
.thumb-wrap img{width:100%;height:100%;object-fit:cover}
.thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--muted)}
.duration-badge{position:absolute;bottom:.4rem;right:.4rem;background:rgba(0,0,0,.8);color:#fff;font-size:.7rem;font-weight:700;padding:.1rem .4rem;border-radius:4px}
.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(230,57,70,0);transition:background .2s}
.video-card:hover .play-overlay{background:rgba(230,57,70,.15)}
.play-icon{width:48px;height:48px;background:rgba(230,57,70,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
.video-card:hover .play-icon{opacity:1;transform:scale(1)}
.card-info{padding:.85rem}
.card-title{font-size:.9rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.4rem}
.card-meta{font-size:.75rem;color:var(--muted);display:flex;gap:.75rem;align-items:center}
.card-del{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:.25rem;border-radius:4px}
.card-del:hover{color:var(--accent);background:rgba(230,57,70,.1)}
.sidebar{display:flex;flex-direction:column;gap:1.5rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-head{padding:1rem 1.25rem;border-bottom:1px solid var(--border);font-family:var(--font-h);font-size:1.1rem;letter-spacing:.05em;display:flex;align-items:center;gap:.5rem}
.panel-body{padding:1.25rem;display:flex;flex-direction:column;gap:.75rem}
.field label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.35rem}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.875rem;padding:.6rem .9rem;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem 1.25rem;border:none;border-radius:8px;font-size:.875rem;font-weight:700;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:linear-gradient(135deg,var(--accent),#c1121f);color:#fff;box-shadow:0 4px 20px rgba(230,57,70,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(230,57,70,.4)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pagination{display:flex;gap:.5rem;justify-content:center;margin-top:1.5rem}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;width:36px;height:36px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.page-btn:hover,.page-btn.active{border-color:var(--accent);color:var(--accent)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-backdrop.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:860px;overflow:hidden}
.modal-header{padding:1rem 1.25rem;display:flex;align-items:flex-start;gap:1rem;border-bottom:1px solid var(--border)}
.modal-title{font-weight:700;font-size:1rem;flex:1}
.modal-close{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.modal-close:hover{border-color:var(--accent);color:var(--accent)}
.video-player-wrap{position:relative;aspect-ratio:16/9;background:#000}
.video-player-wrap video,.video-player-wrap iframe{width:100%;height:100%;border:none}
.modal-info{padding:1rem 1.25rem}
.modal-desc{font-size:.85rem;color:var(--muted);line-height:1.6}
.toast-container{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.5rem;z-index:300}
.toast{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.1rem;font-size:.85rem;display:flex;align-items:center;gap:.6rem;min-width:240px;animation:slideRight .3s ease}
@keyframes slideRight{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--accent)}
.toast.info{border-left:3px solid #4cc9f0}
.tab-content{display:none}
.tab-content.active{display:block}
.admin-panel{display:none}
.admin-panel.visible{display:block}
.admin-section{margin-bottom:1.5rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;padding:1.25rem}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem;text-align:center}
.stat-num{font-family:var(--font-h);font-size:1.8rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:.7rem;color:var(--muted);text-transform:uppercase}
@media(max-width:900px){.main{grid-template-columns:1fr}.sidebar{order:-1}.category-filter{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">VIDEO<span>STREAM</span> CMS</div>
  <div class="search-wrap"><span class="search-icon">🔍</span><input id="searchInput" type="text" placeholder="Поиск по видео..."/></div>
  <div class="category-filter"><select id="categoryFilter" class="category-select" onchange="loadVideos(1)"><option value="">Все категории</option></select></div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('catalog')">📺 Каталог</button>
    <button class="nav-tab" onclick="switchTab('admin')">⚙️ Админка</button>
  </nav>
</header>
<div class="main">
  <div>
    <div id="topAdBanner"></div>
    <div id="tab-catalog" class="tab-content active">
      <h2 style="font-family:var(--font-h);font-size:1.8rem;margin-bottom:1.25rem;">Видеотека <span id="totalBadge" style="background:var(--accent);color:#fff;font-size:.7rem;padding:.2rem .5rem;border-radius:4px;">0</span></h2>
      <div class="video-grid" id="videoGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
    <div id="tab-admin" class="tab-content">
      <div id="loginSection" class="admin-section">
        <div class="panel">
          <div class="panel-head">🔐 Вход в админ-панель</div>
          <div class="panel-body">
            <div class="field"><label>Логин</label><input id="adminUsername" type="text" placeholder="admin"/></div>
            <div class="field"><label>Пароль</label><input id="adminPassword" type="password" placeholder="••••••••"/></div>
            <button class="btn btn-primary" onclick="login()">Войти</button>
            <p style="font-size:.75rem;color:var(--muted);text-align:center;margin-top:.5rem;">По умолчанию: admin / admin123</p>
          </div>
        </div>
      </div>
      <div id="adminDashboard" class="admin-panel">
        <div class="admin-section">
          <div class="panel">
            <div class="panel-head">📊 Статистика</div>
            <div class="stats-grid">
              <div class="stat-box"><div class="stat-num" id="statTotalVideos">0</div><div class="stat-label">Видео</div></div>
              <div class="stat-box"><div class="stat-num" id="statTotalViews">0</div><div class="stat-label">Просмотры</div></div>
              <div class="stat-box"><div class="stat-num" id="statCategories">0</div><div class="stat-label">Категории</div></div>
              <div class="stat-box"><div class="stat-num" id="statAds">0</div><div class="stat-label">Реклама</div></div>
            </div>
          </div>
        </div>
        <div class="admin-section">
          <div class="panel">
            <div class="panel-head">⚡ Парсер видео</div>
            <div class="panel-body">
              <div class="field"><label>URL страницы с видео</label><input id="parseUrl" type="url" placeholder="https://example.com/video/123"/></div>
              <div class="field"><label>Категория</label><select id="parseCategory"><option value="">Без категории</option></select></div>
              <button class="btn btn-primary" onclick="parseSingle()" id="btnParse">▶ Спарсить видео</button>
              <div id="parseLog" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem;font-size:.78rem;font-family:monospace;color:var(--green);max-height:140px;overflow-y:auto;display:none;"></div>
            </div>
          </div>
        </div>
        <div class="admin-section">
          <div class="panel">
            <div class="panel-head">📦 Массовый парсинг</div>
            <div class="panel-body">
              <div class="field"><label>URL каталога</label><input id="bulkUrl" type="url" placeholder="https://example.com/videos"/></div>
              <div class="field"><label>Макс. видео</label><select id="bulkMax"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option></select></div>
              <div class="field"><label>Категория</label><select id="bulkCategory"><option value="">Без категории</option></select></div>
              <button class="btn btn-primary" onclick="parseBulk()" id="btnBulk">⚡ Массовый парсинг</button>
            </div>
          </div>
        </div>
        <div class="admin-section">
          <div class="panel">
            <div class="panel-head">📢 Управление рекламой</div>
            <div class="panel-body">
              <div class="field"><label>Позиция</label><select id="adPosition"><option value="top">Верхний баннер</option><option value="bottom">Нижний баннер</option></select></div>
              <div class="field"><label>URL изображения</label><input id="adImageUrl" type="url" placeholder="https://..."/></div>
              <div class="field"><label>Ссылка</label><input id="adLinkUrl" type="url" placeholder="https://..."/></div>
              <button class="btn btn-secondary" onclick="createAd()">Добавить баннер</button>
            </div>
          </div>
        </div>
        <div class="admin-section"><button class="btn btn-secondary" onclick="logout()" style="border-color:var(--accent);color:var(--accent);">🚪 Выйти</button></div>
      </div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="panel">
      <div class="panel-head">📊 Быстрая статистика</div>
      <div class="stats-grid" style="grid-template-columns:1fr 1fr;">
        <div class="stat-box"><div class="stat-num" id="sideTotal">0</div><div class="stat-label">Видео</div></div>
        <div class="stat-box"><div class="stat-num" id="sidePages">1</div><div class="stat-label">Страница</div></div>
      </div>
    </div>
  </aside>
</div>
<div style="max-width:1400px;margin:0 auto;padding:0 2rem;"><div id="bottomAdBanner"></div></div>
<div class="modal-backdrop" id="playerModal" onclick="if(event.target===this)closePlayer()">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitle">Название видео</div><button class="modal-close" onclick="closePlayer()">✕</button></div>
    <div class="video-player-wrap" id="playerWrap"></div>
    <div class="modal-info"><div class="modal-desc" id="modalDesc">Описание видео</div></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
const API="http://localhost:5000/api";let currentPage=1,totalVideos=0,searchQuery="",currentCategory="",isLoggedIn=false;
document.addEventListener('DOMContentLoaded',()=>{checkAuth();loadCategories();loadVideos(1);loadAds();});
async function checkAuth(){try{const res=await fetch(`${API}/admin/status`,{credentials:'include'});const data=await res.json();isLoggedIn=data.logged_in;updateAdminUI();}catch{}}
async function login(){const username=document.getElementById('adminUsername').value.trim();const password=document.getElementById('adminPassword').value.trim();if(!username||!password){toast('Введите логин и пароль','error');return;}try{const res=await fetch(`${API}/admin/login`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username,password})});const data=await res.json();if(data.success){isLoggedIn=true;toast('Вход выполнен успешно!','success');document.getElementById('adminUsername').value='';document.getElementById('adminPassword').value='';updateAdminUI();loadAdminStats();}else{toast(data.error||'Ошибка входа','error');}}catch{toast('Бэкенд недоступен','error');}}
async function logout(){await fetch(`${API}/admin/logout`,{method:'POST',credentials:'include'});isLoggedIn=false;toast('Вы вышли из системы','info');updateAdminUI();}
function updateAdminUI(){document.getElementById('loginSection').style.display=isLoggedIn?'none':'block';document.getElementById('adminDashboard').classList.toggle('visible',isLoggedIn);if(isLoggedIn)loadAdminStats();}
async function loadCategories(){try{const res=await fetch(`${API}/categories`);const data=await res.json();const filter=document.getElementById('categoryFilter');const parseCat=document.getElementById('parseCategory');const bulkCat=document.getElementById('bulkCategory');[filter,parseCat,bulkCat].forEach(sel=>{sel.innerHTML='<option value="">Без категории</option>';data.categories.forEach(cat=>{sel.innerHTML+=`<option value="${cat.id}">${cat.name}</option>`;});});}catch{}}
async function loadVideos(page=1){currentPage=page;currentCategory=document.getElementById('categoryFilter').value;searchQuery=document.getElementById('searchInput').value.trim();let url=`${API}/videos?page=${page}&per_page=12`;if(searchQuery)url+=`&q=${encodeURIComponent(searchQuery)}`;if(currentCategory)url+=`&category_id=${currentCategory}`;try{const res=await fetch(url);const data=await res.json();totalVideos=data.total;renderGrid(data.videos);renderPagination(data.total,page,12);updateStats(data.total);}catch{renderGrid([]);toast('Бэкенд недоступен. Запустите parser_backend.py','error');}}
function renderGrid(videos){const grid=document.getElementById('videoGrid');if(!videos.length){grid.innerHTML=`<div style="text-align:center;padding:4rem 2rem;color:var(--muted);grid-column:1/-1;"><div style="font-size:4rem;margin-bottom:1rem;">🎬</div><h3 style="font-family:var(--font-h);font-size:1.5rem;color:var(--text);">${searchQuery?'Ничего не найдено':'Видео не добавлены'}</h3><p>${searchQuery?'Попробуйте другой запрос':'Воспользуйтесь парсером в админке'}</p></div>`;return;}grid.innerHTML=videos.map((v,i)=>`<div class="video-card" style="animation-delay:${i*0.05}s" onclick="openPlayer(${v.id})"><div class="thumb-wrap">${v.thumbnail?`<img src="${v.thumbnail}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=thumb-placeholder>🎬</div>'">`:'<div class="thumb-placeholder">🎬</div>'}<div class="play-overlay"><div class="play-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div></div>${v.duration?`<div class="duration-badge">${v.duration}</div>`:''}</div><div class="card-info"><div class="card-title">${escHtml(v.title)}</div><div class="card-meta"><span>${escHtml(v.author||'—')}</span><span style="width:3px;height:3px;background:var(--muted);border-radius:50%;"></span><span>${timeAgo(v.added_at)}</span>${isLoggedIn?`<button class="card-del" title="Удалить" onclick="deleteVideo(event,${v.id})">✕</button>`:''}</div></div></div>`).join('');}
function renderPagination(total,page,perPage){const pages=Math.ceil(total/perPage);const p=document.getElementById('pagination');if(pages<=1){p.innerHTML='';return;}let html='';for(let i=1;i<=pages;i++){html+=`<button class="page-btn ${i===page?'active':''}" onclick="loadVideos(${i})">${i}</button>`;}p.innerHTML=html;}
function updateStats(total){document.getElementById('sideTotal').textContent=total;document.getElementById('sidePages').textContent=currentPage;document.getElementById('totalBadge').textContent=total;}
let searchTimer;document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadVideos(1),400);});
async function parseSingle(){if(!isLoggedIn){toast('Требуется авторизация','error');return;}const url=document.getElementById('parseUrl').value.trim();const category_id=document.getElementById('parseCategory').value;if(!url){toast('Введите URL','error');return;}const log=document.getElementById('parseLog');const btn=document.getElementById('btnParse');log.style.display='block';log.innerHTML='';btn.disabled=true;addLog(log,`⏳ Парсинг: ${url}`);try{const res=await fetch(`${API}/parse`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({url,category_id:category_id||null})});const data=await res.json();if(data.error){addLog(log,`❌ ${data.error}`,'err');toast(data.error,'error');}else{addLog(log,`✅ Добавлено: ${data.title}`);toast('Видео успешно добавлено!','success');loadVideos(1);document.getElementById('parseUrl').value='';}}catch{addLog(log,'❌ Бэкенд недоступен','err');toast('Запустите parser_backend.py','error');}btn.disabled=false;}
async function parseBulk(){if(!isLoggedIn){toast('Требуется авторизация','error');return;}const url=document.getElementById('bulkUrl').value.trim();const max=document.getElementById('bulkMax').value;const category_id=document.getElementById('bulkCategory').value;if(!url){toast('Введите URL каталога','error');return;}const btn=document.getElementById('btnBulk');btn.disabled=true;toast('⏳ Сканирование каталога...','info');try{const res=await fetch(`${API}/parse-bulk`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({url,max_items:parseInt(max),category_id:category_id||null})});const data=await res.json();toast(`Готово! Добавлено ${data.success} видео`,'success');loadVideos(1);}catch{toast('Бэкенд недоступен','error');}btn.disabled=false;}
async function loadAds(){try{const res=await fetch(`${API}/ads`);const data=await res.json();const topAd=data.ads.find(a=>a.position==='top');const bottomAd=data.ads.find(a=>a.position==='bottom');if(topAd){document.getElementById('topAdBanner').innerHTML=renderAd(topAd);}if(bottomAd){document.getElementById('bottomAdBanner').innerHTML=renderAd(bottomAd);}}catch{}}
function renderAd(ad){if(ad.html_code)return ad.html_code;if(ad.image_url){return `<a href="${ad.link_url||'#'}" target="_blank"><img src="${ad.image_url}" alt="Реклама"></a>`;}return'';}
async function createAd(){if(!isLoggedIn){toast('Требуется авторизация','error');return;}const position=document.getElementById('adPosition').value;const image_url=document.getElementById('adImageUrl').value.trim();const link_url=document.getElementById('adLinkUrl').value.trim();if(!position){toast('Выберите позицию','error');return;}try{const res=await fetch(`${API}/ads`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({position,image_url,link_url})});const data=await res.json();if(data.success){toast('Баннер добавлен','success');loadAds();document.getElementById('adImageUrl').value='';document.getElementById('adLinkUrl').value='';}}catch{toast('Ошибка','error');}}
async function loadAdminStats(){if(!isLoggedIn)return;try{const res=await fetch(`${API}/admin/stats`,{credentials:'include'});const data=await res.json();document.getElementById('statTotalVideos').textContent=data.total_videos;document.getElementById('statTotalViews').textContent=data.total_views;document.getElementById('statCategories').textContent=data.total_categories;document.getElementById('statAds').textContent=data.active_ads;}catch{}}
async function openPlayer(id){try{const res=await fetch(`${API}/videos/${id}`);const v=await res.json();document.getElementById('modalTitle').textContent=v.title;document.getElementById('modalDesc').textContent=v.description||'Нет описания';const wrap=document.getElementById('playerWrap');if(v.video_url){if(v.video_url.includes('.m3u8')){wrap.innerHTML=`<video controls autoplay style="width:100%;height:100%;background:#000"><source src="${v.video_url}" type="application/x-mpegURL">Ваш браузер не поддерживает HLS</video>`;}else if(v.video_url.match(/\.(mp4|webm|ogg)/)){wrap.innerHTML=`<video controls autoplay style="width:100%;height:100%;background:#000"><source src="${v.video_url}"></video>`;}else{wrap.innerHTML=`<iframe src="${v.video_url}" allowfullscreen allow="autoplay"></iframe>`;}}else{wrap.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;background:#000;color:#6b6b80"><span style="font-size:3rem">🔗</span><span>Прямая ссылка не найдена</span><a href="${v.source_url}" target="_blank" style="color:#e63946">Открыть источник →</a></div>`;}document.getElementById('playerModal').classList.add('open');}catch{toast('Не удалось загрузить видео','error');}}
function closePlayer(){document.getElementById('playerModal').classList.remove('open');document.getElementById('playerWrap').innerHTML='';}
async function deleteVideo(e,id){e.stopPropagation();if(!confirm('Удалить видео?'))return;try{await fetch(`${API}/videos/${id}`,{method:'DELETE',credentials:'include'});toast('Удалено','info');loadVideos(currentPage);}catch{toast('Ошибка удаления','error');}}
function addLog(el,msg,type=''){el.innerHTML+=`<div class="log-line ${type}">${msg}</div>`;el.scrollTop=el.scrollHeight;}
function toast(msg,type='info'){const c=document.getElementById('toastContainer');const icons={success:'✅',error:'❌',info:'ℹ️'};const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=`<span>${icons[type]||'•'}</span><span>${msg}</span>`;c.appendChild(el);setTimeout(()=>el.remove(),3500);}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function timeAgo(dt){if(!dt)return'';const d=new Date(dt),now=new Date();const diff=Math.floor((now-d)/1000);if(diff<60)return'только что';if(diff<3600)return Math.floor(diff/60)+' мин назад';if(diff<86400)return Math.floor(diff/3600)+' ч назад';return Math.floor(diff/86400)+' дн назад';}
function switchTab(name){document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));event.currentTarget.classList.add('active');document.getElementById('tab-'+name).classList.add('active');}
</script>
